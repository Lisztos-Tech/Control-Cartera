# Entorno de DESARROLLO. En producción la app se conecta al Postgres
# existente del servidor vía DATABASE_URL (ver README).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    tty: true # el watcher de tailwind termina sin TTY y foreman tumba todo
    command: bash -c "bin/rails db:prepare && bin/rails db:seed && bin/dev"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      BINDING: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bundle_cache:
